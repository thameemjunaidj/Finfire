name: Verify FinFire

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: finfire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check, test, and bundle all platforms
        run: npm run verify

      - name: Check Expo project health
        run: npx --yes expo-doctor
